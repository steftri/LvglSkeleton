name: Crowpanel Binary Build

on:
  push:
  pull_request:

jobs:
  crowpanel-binary-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Run PlatformIO command
        run: platformio run --environment crowpanel_esp32_5inch_v2